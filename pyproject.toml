[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oopz-voice-capture"
version = "0.11.15"
description = "Managed OOPZ capture, transcript, and analysis pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "oopz-sdk>=0.15,<0.16",
  "Pillow>=12.3,<13",
]

[project.optional-dependencies]
speech = [
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
  "onnxruntime>=1.16,<2",
  "silero-vad>=6.2,<7",
  "funasr==1.4.1",
  "modelscope==1.39.1",
]
feishu = [
  "lark-oapi>=1.7.1,<2",
  "qrcode>=8,<9",
]

[project.scripts]
oopz-capture = "oopz_capture.main:main"
oopz-transcribe = "oopz_capture.speech_cli:main"
oopz-worker = "oopz_capture.worker_cli:main"
oopz-continuous = "oopz_capture.continuous_cli:main"
oopz-digest = "oopz_capture.analyzer.__main__:main"
oopz-feishu = "oopz_capture.feishu_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
oopz_capture = ["analyzer/*.txt", "digest/render/design/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["needs_fonts: renders a card, so the fonts from scripts/download_fonts.py must be present"]
